services:
  - type: web
    name: cortex
    runtime: python
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn core.api_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5

      - key: CORTEX_BRIDGE_TOKEN
        sync: false

      - key: CORTEX_ALLOWED_ORIGIN
        sync: false
